# Cloudflare Worker + Static Assets deploy for the awesome-mad-projects site.
#
# This matches a `npx wrangler deploy` build command (Workers Builds). The static
# site in ./site is served via the Assets binding; the small Worker in
# ./worker/index.js adds the GET /api/projects JSON endpoint (everything else is
# served directly from ./site).
#
# Deploy (from repo root):
#   npx wrangler deploy
# Local preview:
#   npx wrangler dev
#
# Custom domain (mad-projects.com): Cloudflare dashboard -> Workers & Pages ->
# awesome-mad-projects -> Settings -> Domains & Routes -> Add -> mad-projects.com.

name = "awesome-mad-projects"
main = "worker/index.js"
compatibility_date = "2026-08-18"

[assets]
directory = "./site"
binding = "ASSETS"
